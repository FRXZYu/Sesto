name: Compilar y Publicar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permiso a Gradle y compilar APK Debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar APK listo para descargar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: Descargar App (APK)
          body: APK compilado automáticamente. Descarga el archivo app-debug.apk aquí abajo.
          files: app/build/outputs/apk/debug/app-debug.apk
